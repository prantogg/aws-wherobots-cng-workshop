<!DOCTYPE html>
<meta charset="utf-8">
<title>ask-the-data engine spike</title>
<!--
  The phase-3 gate, as a page you can run. ASK_THE_DATA_PLAN.md section 7.

  This is a HARNESS, not a feature. It is deliberately separate from index.html: the app must not
  grow an engine dependency before the gate is passed, and a harness that can only be reached on
  purpose cannot regress the map.

  It reports every acceptance criterion in one of three states, and the three are never blurred:
    PASS     the criterion was checked here and held
    FAIL     the criterion was checked here and did not hold
    BLOCKED  the criterion needs the engine and/or the published extract, neither of which this
             page could reach. NOT a pass. A criterion nobody could evaluate is the thing the
             floors guardrail exists to stop being read as "fine".

  Serve from the app root on port 8080 or 8090 (the tiles bucket's CORS allows those, and not
  Vite's 5173):   python3 -m http.server 8080   ->   /query/spike.html
  Engine location is a query param, since the 57.5 MB build is not in this repo:
      /query/spike.html?wasmBase=http://localhost:8081/pkg/
-->
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 24px; max-width: 980px; color: #1a1a1a; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #555; margin: 0 0 20px; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0 24px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e4e4e4;
           vertical-align: top; }
  th { background: #f4f4f4; }
  .s { font-weight: 700; white-space: nowrap; }
  .PASS { color: #17703a; } .FAIL { color: #a11; } .BLOCKED { color: #8a6100; }
  pre { background: #f7f7f7; padding: 10px; overflow-x: auto; font-size: 12px; }
  .note { background: #fff8e1; border-left: 3px solid #d9a400; padding: 8px 12px; }
</style>

<h1>ask-the-data engine spike</h1>
<p class="sub">Phase 3 gate for <code>ASK_THE_DATA_PLAN.md</code>. Findings and the GO/NO-GO call
live in <code>SPIKE_FINDINGS.md</code>; this page is how they are reproduced.</p>

<div class="note" id="env"></div>
<table id="out"><thead><tr><th>#</th><th>Criterion</th><th class="s">Status</th><th>Evidence</th></tr></thead><tbody></tbody></table>
<pre id="sql"></pre>

<!-- pinned h3-js, the same build tests/fetch_h3.sh caches for the Node guards (h3cover.js
     declares the version, URL and hash). Loaded from a CDN like MapLibre and pmtiles are. -->
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"
        integrity="sha256-CHDZTeOFA732tj3OjEgSpC3ENWXxWuNWlK7fT5fq9Ug="
        crossorigin="anonymous"></script>
<script src="validate.js"></script>
<script src="h3cover.js"></script>
<script src="registry.js"></script>
<script src="sqlbuild.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  var Q = window.CoRiskQuery;
  var DENVER = { lon: -104.9903, lat: 39.7392 };
  var TEN_MILES_M = 16093.4;
  var params = new URLSearchParams(location.search);
  var wasmBase = params.get("wasmBase");

  var tbody = document.querySelector("#out tbody"), n = 0;

  // Everything variable on this page is set as TEXT, never as markup. Criterion evidence carries
  // engine error strings and the URL-controlled wasmBase, and `innerHTML` on either is a
  // reflected-XSS vector from a crafted harness link. It is a local harness, but the fix costs
  // nothing and the habit is the point.
  function cell(tag, text, className) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = text;
    return el;
  }
  function evidenceCell(text) {
    var td = document.createElement("td");
    td.appendChild(cell("code", text));
    return td;
  }
  function row(name, status, evidence) {
    n++;
    var tr = document.createElement("tr");
    tr.appendChild(cell("td", String(n)));
    tr.appendChild(cell("td", name));
    tr.appendChild(cell("td", status, "s " + status));
    tr.appendChild(evidenceCell(evidence));
    tbody.appendChild(tr);
  }
  function check(name, fn) {
    try { var e = fn(); row(name, "PASS", e); }
    catch (err) { row(name, "FAIL", (err && err.message) || String(err)); }
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  (function () {
    var env = document.getElementById("env");
    env.appendChild(document.createTextNode("JSPI in this browser: "));
    env.appendChild(cell("b", Q.engine.jspiSupported() ? "yes" : "NO"));
    env.appendChild(document.createTextNode(" \u00b7 engine build: "));
    env.appendChild(cell("code", Q.engine.PINNED_COMMIT.slice(0, 12)));
    env.appendChild(document.createTextNode(" \u00b7 wasmBase: "));
    env.appendChild(cell("code", wasmBase || "not supplied, engine checks will report BLOCKED"));
  })();

  // ---- 1. cell-count bound, and no res-7 at a large radius ------------------
  check("Cell-count bound: covering set stays within the cap at 1 km, 10 mi and the 80 km clamp",
    function () {
      var out = [1000, TEN_MILES_M, 80000].map(function (r) {
        var c = Q.h3cover.coverCircle(DENVER, r);
        if (c.mode === "h3") {
          assert(c.cellCount <= Q.h3cover.MAX_CELLS,
                 r + " m emitted " + c.cellCount + " cells");
          assert(!(r > 20000 && c.resolution === 7), r + " m emitted a res-7 predicate");
          return r + " m -> res-" + c.resolution + ", " + c.cellCount + " cells";
        }
        return r + " m -> county fallback (no stored resolution fits)";
      });
      return out.join(" | ");
    });

  // ---- 2. H3 superset soundness --------------------------------------------
  check("Boundary superset (H3): every cell holding a point just inside the radius is covered",
    function () {
      var r = TEN_MILES_M, c = Q.h3cover.coverCircle(DENVER, r);
      assert(c.mode === "h3", "expected the H3 path at 10 miles");
      var missed = 0, probes = 0;
      for (var b = 0; b < 360; b += 2) {
        // Points at 99.9% of the radius: unambiguously inside, and as close to the edge as the
        // prefilter can be tested without arguing about float noise.
        var p = Q.h3cover.destination(DENVER.lat, DENVER.lon, r * 0.999, b);
        var cell = h3.latLngToCell(p[0], p[1], c.resolution);
        probes++;
        if (c.cells.indexOf(cell) === -1) missed++;
      }
      assert(missed === 0, missed + " of " + probes + " in-radius probes fell outside the cover");
      return probes + " probes around the edge, 0 outside the cover (" + c.cellCount + " cells)";
    });

  // ---- 3. county-fallback superset ------------------------------------------
  check("Boundary superset (county): a large radius near a county line selects both sides",
    function () {
      // Synthetic two-county manifest with a shared edge at lon -105.0, so the assertion is about
      // the selection rule and not about whichever bbox today's extract happens to have.
      var manifest = { version: "20260101", counties: [
        { county: "08031", name: "A", rows: 1, path: "county=08031/part.parquet",
          bbox: [-105.0, 39.5, -104.5, 40.0] },
        { county: "08059", name: "B", rows: 1, path: "county=08059/part.parquet",
          bbox: [-105.5, 39.5, -105.0, 40.0] },
        { county: "08125", name: "far", rows: 1, path: "county=08125/part.parquet",
          bbox: [-102.5, 39.5, -102.0, 40.0] }
      ]};
      var near = { lon: -104.97, lat: 39.75 };
      var sel = Q.registry.selectCounties(manifest, near, 40000).map(function (c) { return c.county; });
      assert(sel.indexOf("08031") >= 0 && sel.indexOf("08059") >= 0,
             "40 km near the line selected " + JSON.stringify(sel));
      assert(sel.indexOf("08125") === -1, "an unrelated county was selected: " + JSON.stringify(sel));
      return "40 km at " + near.lon + " selects " + JSON.stringify(sel);
    });

  // ---- 4. clamp / reject, both ends, both origins ----------------------------
  check("Clamp and reject: oversized clamps, malformed rejects, from a tool call and from ?q=",
    function () {
      var ok = Q.validate.validateQuery({ center: DENVER, radius_m: 1e9, metric: "composite",
                                          limit: 100000 });
      assert(ok.ok && ok.value.radius_m === 80000 && ok.value.limit === 50, "upper end not clamped");
      var bad = [
        { radius_m: 0 }, { radius_m: -5 }, { radius_m: NaN }, { radius_m: "abc" },
        { limit: 0 }, { limit: -1 }, { limit: 2.5 },
        { metric: "improv_val" }, { metric: "composite; DROP" },
        { center: { lon: 200, lat: 39 } }, { version: "2026" }
      ];
      bad.forEach(function (patch) {
        var input = { center: DENVER, radius_m: 1000, metric: "composite", limit: 10 };
        for (var k in patch) input[k] = patch[k];
        assert(!Q.validate.validateQuery(input).ok, "accepted " + JSON.stringify(patch));
      });
      var link = Q.validate.parseQueryLink(
        "?q=" + encodeURIComponent("lon=-104.99&lat=39.73&radius_m=999999999&metric=composite&limit=100000"));
      assert(link.isQueryLink && link.result.ok && link.result.value.radius_m === 80000 &&
             link.result.value.limit === 50, "deep link bypassed the clamps");
      var badLink = Q.validate.parseQueryLink(
        "?q=" + encodeURIComponent("lon=200&lat=39.73&radius_m=1000&metric=composite&limit=10"));
      assert(!badLink.result.ok, "deep link bypassed the centre check");
      return bad.length + " malformed inputs rejected, both ends clamped, ?q= goes through the " +
             "same validator";
    });

  // ---- 5. the file-to-relation bridge ----------------------------------------
  check("File-to-relation bridge: identifier substitution only, no alias, no DDL", function () {
    var sql = Q.sqlbuild.substituteRelation(
      "SELECT * FROM co_risk_query b WHERE b.county = '08031'",
      ["co_risk_query_08001", "co_risk_query_08031"]);
    assert(sql.indexOf("FROM (SELECT * FROM co_risk_query_08001 UNION ALL " +
                       "SELECT * FROM co_risk_query_08031) b") >= 0, "bad substitution: " + sql);
    assert(!/\)\s+AS\s+b\s+b/.test(sql), "derived table carried its own alias");
    assert(!/CREATE\s+(OR\s+REPLACE\s+)?VIEW/i.test(sql), "substitution emitted DDL");
    var untouched = Q.sqlbuild.substituteRelation("SELECT * FROM co_risk_query x, co_risk_query_08001 y",
                                                  ["co_risk_query_08001"]);
    assert(untouched.indexOf("co_risk_query_08001 y") >= 0, "a per-file name was rewritten");
    return "FROM co_risk_query b -> FROM (SELECT ... UNION ALL ...) b";
  });

  // The Denver statement itself, for the record.
  (function () {
    var v = Q.validate.validateQuery({ center: DENVER, radius_m: TEN_MILES_M,
                                       metric: "composite", limit: 10 }).value;
    var cover = Q.h3cover.coverCircle(v.center, v.radius_m);
    var counties = [{ table: "co_risk_query_08031", url: "https://example/part.parquet" },
                    { table: "co_risk_query_08059", url: "https://example/part.parquet" }];
    document.getElementById("sql").textContent =
      Q.sqlbuild.buildQuery(v, cover, counties).sql;
  })();

  // ---- 6-9. everything that needs the engine ---------------------------------
  var engineChecks = [
    ["CRS and units: the 10-mile query returns nothing beyond 16,093.4 m (metres, not degrees)"],
    ["JSPI fallback correctness: a non-JSPI browser returns the same top 10 or fails loudly"],
    ["Range-read profile: res-7, res-6, res-5 and county-fallback each read < 25% of the extract"],
    ["The Denver query returns rows in the browser"]
  ];
  if (!wasmBase) {
    engineChecks.forEach(function (c) {
      row(c[0], "BLOCKED", "no engine build supplied (?wasmBase=...), and the extract is not " +
          "published yet - see SPIKE_FINDINGS.md");
    });
  } else {
    engineChecks.forEach(function (c) { row(c[0], "BLOCKED", "engine run in progress..."); });
    Q.engine.loadEngine({ wasmBase: wasmBase, workerUrl: "spike-worker.js",
                          onDebug: function (s) { console.log("[engine]", s); } })
      .then(function (eng) {
        // Registration is the first thing that can fail, and the engine's own message is the
        // diagnosis, so it is shown verbatim.
        var url = Q.registry.versionRoot(params.get("version") || "00000000") +
                  "county=08031/part.parquet";
        return eng.register(url, "co_risk_query_08031").then(function () {
          return eng.runArrow("SELECT COUNT(*) AS n FROM co_risk_query_08031");
        });
      })
      .then(function () { console.log("engine reachable; extend this harness with the real run"); })
      .catch(function (err) {
        var rows = tbody.querySelectorAll("tr");
        for (var i = rows.length - engineChecks.length; i < rows.length; i++) {
          rows[i].replaceChild(evidenceCell(String(err.message).slice(0, 300)),
                               rows[i].children[3]);
        }
      });
  }
})();
</script>
